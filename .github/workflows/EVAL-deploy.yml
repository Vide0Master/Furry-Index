name: Build and deploy (EVALUATION)

on:
  push:
    branches:
      - evaluation

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Docker Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}:latest
          IMAGE_NAME=${IMAGE_NAME,,}
          docker build -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker push $IMAGE_NAME

  remote-deploy:
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Checkout (again for copying compose file)
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy compose + .env.example via scp
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.yml .env.example \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}/

      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ${{ secrets.REMOTE_PATH }}

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            rm .env.example

            docker compose pull

            docker compose up -d
          EOF

  health-check:
    runs-on: ubuntu-latest

    needs: remote-deploy

    steps:
      - name: Wait for response
        run: |
          URL="https://https://furry-index-eval.vmtech.services/api/whatisthisbuild"
          max_attempts=30
          attempt=1
          interval=1
  
          while true; do
            echo "Attempt $attempt / $max_attempts"
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "$URL" || true)
            if [ "$status" = "200" ]; then
              echo "Remote service started succesfully."
              break
            fi
  
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Remote service returned error. Last status = $status"
              exit 1
            fi
  
            attempt=$(( attempt + 1 ))
            sleep $interval
          done